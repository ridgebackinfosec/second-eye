version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # NOT main: main is the release branch, reached only via a
    # develop -> main pull request. A Dependabot PR opened against main
    # would bypass that flow and could trip the release workflow.
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # The dev/test toolchain batches into one PR: these only affect the
      # four gates, so reviewing them together is enough.
      dev-tooling:
        patterns:
          - "pytest"
          - "pytest-*"
          - "ruff"
          - "mypy"
          - "types-*"
    # The four runtime dependencies (cryptography, h11, idna, argcomplete)
    # are deliberately left ungrouped. All but argcomplete are load-bearing
    # for TLS interception and HTTP parsing and carry upper-bound pins in
    # pyproject.toml, so each needs its own review and manual smoke test
    # against a real capture before it lands.

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
