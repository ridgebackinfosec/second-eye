name: CI

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Runs on every push to main and on pull requests. Given this repo's
# established direct-push-to-main workflow, the push trigger is post-hoc
# detection (it reports after a commit lands), not a pre-merge gate — if
# blocking bad commits from reaching main is wanted, that requires moving
# to a PR-based workflow with branch protection requiring this check,
# which is a repo-settings decision outside this file's scope.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src/secondeye

      - name: pytest
        run: pytest -q
