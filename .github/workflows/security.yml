name: Security Scanning

permissions:
  contents: read

# Both branches plus a weekly cron, so a newly-published advisory against
# an unchanged dependency surfaces without needing a commit to trigger it.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'   # Weekly, Monday 00:00 UTC

# There is deliberately no bandit job here. Bandit's checks already run as
# a HARD gate in test.yml, via ruff's `S` rule family over the whole tree
# (see pyproject.toml's [tool.ruff.lint] select list), with every
# suppression individually justified in-file. A second, soft-failed bandit
# pass would be strictly weaker than the gate already in place and would
# duplicate its findings as non-blocking noise.

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # This project has no requirements.txt (dependencies live in
      # pyproject.toml with range pins), so the audit runs against the
      # resolved, installed environment — which is what actually ships —
      # rather than a lockfile.
      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      # Soft-failed: a new advisory against a transitive dependency is
      # real information but is not caused by, and usually cannot be fixed
      # in, the pull request that happens to be open when it lands. Making
      # this a hard gate would need a pinned lockfile plus a documented
      # ignore mechanism for advisories with no available fix.
      - name: pip-audit (JSON report)
        run: pip-audit --format json --output pip-audit-report.json
        continue-on-error: true

      - name: pip-audit (human-readable)
        if: always()
        run: pip-audit
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: pip-audit-report.json

  # Hard gate — unlike the audit above, a CodeQL finding is about this
  # repo's own code, so it is actionable in the pull request that raised it.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
