[project]
name = "second-eye"
version = "1.0.0"
description = "Scope-gated recording proxy for offensive security engagements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Chris Traynor" },
]
keywords = [
    "proxy",
    "mitm",
    "security",
    "pentest",
    "offensive-security",
    "http",
    "https",
    "tls",
    "recording",
    "har",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "cryptography>=42.0,<43.0",
    "h11>=0.14,<0.15",
    "idna>=3.6,<4.0",
    "argcomplete>=3.1,<4.0",
]

[project.urls]
Homepage = "https://github.com/ridgebackinfosec/second-eye"
Repository = "https://github.com/ridgebackinfosec/second-eye"
Issues = "https://github.com/ridgebackinfosec/second-eye/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
secondeye = "secondeye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondeye"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PTH", "S"]
ignore = [
    "S101",  # assert is idiomatic here: some src/ uses are mypy
             # type-narrowing, others are runtime isinstance() checks on
             # already-trusted internal data (the control socket is
             # loopback-only and 0700, the JSONL buffer is this daemon's
             # own prior output) — not validation of untrusted external
             # input. pytest itself requires assert in tests/.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S603",  # subprocess calls throughout the test suite use fully
             # test-controlled argv (invoking `secondeye.cli`, `curl`,
             # `openssl` with hardcoded/test-local arguments), never
             # untrusted input.
    "S607",  # partial executable paths (`curl`, `openssl`) are
             # intentional — tests skip via `shutil.which(...)` checks
             # when the binary isn't on PATH, matching this repo's
             # existing `_CURL_MISSING`/`_OPENSSL_MISSING` pattern.
    "S104",  # every "0.0.0.0" literal in tests/ is a value passed to
             # assert a security control (loopback-only binding)
             # correctly REJECTS it — the opposite of a real finding.
    "S103",  # test_tls_ca.py's one 0o755 chmod deliberately simulates a
             # pre-v1.0.0 install's default-permission directory, to
             # prove the daemon tightens it on startup (see Batch 1).
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=secondeye --cov-report=term-missing --cov-fail-under=90"
